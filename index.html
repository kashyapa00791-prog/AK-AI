<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>AK AI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">AK</div>
    <div><h1>AK AI</h1><small>Personal AI Assistant</small></div>
  </div>
  <button id="settingsBtn" class="icon">⚙</button>
</header>

<section class="hero">
  <h2>Ask Anything</h2>
  <p>Chat • Voice • Vision • Files • Research • Agents</p>
</section>

<nav class="modes" id="modes">
  <button data-mode="chat" class="active">💬 Chat</button>
  <button data-mode="research">🔎 Research</button>
  <button data-mode="coding">💻 Coding</button>
  <button data-mode="create">🎨 Create</button>
  <button data-mode="agent">🤖 Agents</button>
  <button data-mode="projects">📁 Projects</button>
</nav>

<main id="chat"></main>

<div id="status" class="status">Ready</div>

<div class="actions">
  <label class="action">📎<input id="file" type="file" multiple></label>
  <label class="action">📷<input id="camera" type="file" accept="image/*" capture="environment"></label>
  <button id="voice" class="action">🎙️</button>
  <button id="web" class="action">🌐 Web</button>
</div>

<form id="form">
  <textarea id="message" placeholder="Ask AK AI anything..." rows="1"></textarea>
  <button id="send">➤</button>
</form>

<aside id="settings" class="panel hidden">
  <div class="panelHead"><h3>⚙ Settings & Privacy</h3><button id="closeSettings">×</button></div>
  <p>Memory: <button id="viewMemory">View</button> <button id="clearMemory">Delete</button></p>
  <p>Web research can be enabled from the 🌐 button.</p>
  <p>Important external/sensitive actions should always require confirmation.</p>
  <div id="memoryBox"></div>
</aside>
</div>
<script src="/static/app.js"></script>
</body>
</html>
